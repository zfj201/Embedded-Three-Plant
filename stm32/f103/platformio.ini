; STM32F103C8T6 —— HAL + 裸机
; 不设置 framework：HAL/CMSIS/启动文件/链接脚本全部来自 CubeMX 生成的文件，
; PlatformIO 只负责调用 arm-none-eabi-gcc 编译、链接、烧录和调试。
; 所有路径相对本文件所在目录（stm32/f103）。

[platformio]
; CubeMX 的目录结构不是 PlatformIO 默认的 src/include，
; 把源码根目录设为工程根目录，再用 build_src_filter 挑选要编译的文件
src_dir = .
include_dir = Core/Inc

[env:f103]
platform = ststm32
; PlatformIO 默认的 GCC 7.2 不认识 CubeMX 链接脚本里的 READONLY 关键字，需要 GCC 11+
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
; board 只用来提供 CPU 类型(cortex-m3)、Flash/RAM 大小、烧录和调试参数
board = genericSTM32F103C8
board_build.ldscript = STM32F103xx_FLASH.ld

; 要编译的源文件，对应 CubeMX Makefile 里的 C_SOURCES / ASM_SOURCES
build_src_filter =
    -<*>
    +<Core/Src/>
    +<Drivers/STM32F1xx_HAL_Driver/Src/>
    +<App/>
    +<startup_stm32f103xb.s>

; 宏定义和头文件路径，对应 CubeMX Makefile 里的 C_DEFS / C_INCLUDES
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -ICore/Inc
    -IApp/Inc
    -IDrivers/STM32F1xx_HAL_Driver/Inc
    -IDrivers/STM32F1xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32F1xx/Include
    -IDrivers/CMSIS/Include
    -Og -g3
    --specs=nano.specs
    -Wl,-Map,.pio/build/${PIOENV}/firmware.map
; 去掉 PlatformIO 裸机模式默认的 -Os，改用上面便于调试的 -Og
build_unflags = -Os

upload_protocol = stlink
debug_tool = stlink
